# Dawn configuration (/etc/dawn/config.yaml)
# Generated from dawn_core.config.schema; every value shown is the default.
# The file is validated on load and hot-reloaded when it changes.

version: 1

general:
  # Device name, used for AirPlay, Bluetooth and mDNS.
  name: Dawn
  # IANA time zone, e.g. Australia/Melbourne.
  timezone: Australia/Sydney
  # Linux hostname; advertised as <hostname>.local.
  hostname: dawn
  log_level: INFO
  # Writable state directory (SQLite, caches, media).
  data_dir: /var/lib/dawn
  # Runtime directory for sockets and the heartbeat file.
  runtime_dir: /run/dawn

location:
  # Fallback latitude when there is no GPS fix.
  latitude: -33.8688
  # Fallback longitude when there is no GPS fix.
  longitude: 151.2093
  # Elevation in metres (for sunrise/sunset).
  elevation_m: 0.0
  # Use the GPS position when a fix is available.
  prefer_gps: true
  # Label shown on the face next to the weather.
  city_label: Sydney

holidays:
  # Default Australian state for public holidays.
  region: NSW
  # Whether regional-only holidays (e.g. Royal Queensland Show) count.
  scope: statewide
  # Additional holiday dates (YYYY-MM-DD) that alarms should skip.
  extra_dates: []
  # Holiday names (substring match) that should NOT count as holidays.
  exclude_names: []

inputs:
  # gpiozero pin factory. lgpio works on Pi 3/4/5/Zero 2 W.
  pin_factory: lgpio
  encoder:
    enabled: true
    # Encoder A (CLK) BCM pin; the encoder's middle pin goes to GND.
    clk_pin: 17
    # Encoder B (DT) BCM pin.
    dt_pin: 27
    # Encoder push-switch BCM pin (other side to GND).
    sw_pin: 22
    # Volume change per detent.
    volume_step: 2
    # Hold time for the nap-timer picker.
    long_press_s: 1.0
    # Swap rotation direction (instead of swapping the A/B wires).
    invert: false
    bounce_time_s: 0.005
  big_button:
    # Not fitted on the reference build; enable only with a button wired to the pin.
    enabled: false
    # Arcade button BCM pin (to GND, internal pull-up).
    pin: 23
    # Hold time for safe shutdown.
    long_press_s: 3.0
    bounce_time_s: 0.02
  # Seconds the face stays bright after a wake tap.
  standby_wake_s: 20
  # Face menu auto-close delay.
  touch_menu_timeout_s: 15

display:
  panel: auto
  width: 800
  height: 480
  rotation: 0
  # Face layout variant.
  layout: rect
  # Theme for the control UI and daytime face.
  theme: dark
  # Reduce face animations (Zero 2 W / 3B+).
  low_cpu: auto
  show_seconds: false
  clock_24h: true
  # While playing, show the ambient clock after this many seconds without a touch (0 = never).
  ambient_after_s: 20
  # Background image behind the clock in Standby and the ambient clock: sky for the time of day, weather and season (off in the night palette and in sleep mode).
  scene: true
  sleep:
    # Use sleep mode at all.
    enabled: true
    # Go to sleep at the bedtime every night (even with the lights on).
    start_at_time: true
    # Bedtime (HH:MM).
    start: '22:30'
    # Also go to sleep whenever the room goes dark (light sensor).
    start_when_dark: true
    # Wake the face at the morning time every day.
    end_at_time: true
    # Morning time (HH:MM).
    end: 06:30
    # Wake the face this many minutes before the next alarm (or its light-wake).
    end_before_alarm: true
    alarm_lead_minutes: 10
    # Wake the face when the room gets bright (light sensor).
    end_when_bright: true
    # Below this the room is dark.
    dark_lux: 3.0
    # ... for this many seconds before the dark trigger counts.
    dark_after_s: 60
    # Above this the room is bright.
    bright_lux: 30.0
    # ... for this many seconds (car headlights do not count).
    bright_after_s: 20
    # The sleep clock moves to a new place this often.
    jump_every_s: 120
    # Brightness of the sleep clock's amber, in the pixels (on top of the backlight).
    level_percent: 72
    # Backlight while asleep (null = the backlight minimum).
    backlight_percent: null
    # Backlight fully off on a black screen while asleep; a tap shows the sleep clock for 10 s, a second tap the full face.
    screen_off: false
    # Brightness of a tap-to-wake while asleep or in the night palette.
    wake_percent: 15
  burn_in:
    # Drift the face's text a few pixels over time (±8 × 6 px, 1 px a minute): invisible, but no edge stays put.
    pixel_orbit: true
    # In Standby, fade the bottom status strip after this many seconds without a touch (0 = never).
    strip_autohide_s: 120
    # Redraw the background's hills and trees from the date, so their outline changes every day.
    scene_daily: true
  backlight:
    # auto picks sysfs (DSI) > HyperPixel PWM > software overlay (HDMI).
    driver: auto
    # Override /sys/class/backlight/<name> directory.
    sysfs_path: null
    # HyperPixel backlight PWM BCM pin.
    pwm_pin: 19
    pwm_frequency_hz: 1000
    # Never drive the backlight below this.
    min_percent: 1
    max_percent: 100
    invert: false
  lux_sensor:
    driver: auto
    i2c_bus: 1
    # Override I2C address (VEML: 0x10 or 0x48, BH1750: 0x23/0x5C).
    address: null
    # Lux sampling and brightness loop rate.
    sample_hz: 10.0
    # EMA factor for lux (1 = no smoothing).
    smoothing: 0.3
  brightness:
    mode: auto
    manual_percent: 60
    # Piecewise-linear lux -> backlight % curve (sorted by lux).
    curve:
    - lux: 0.0
      brightness: 1
    - lux: 3.0
      brightness: 6
    - lux: 20.0
      brightness: 20
    - lux: 100.0
      brightness: 45
    - lux: 400.0
      brightness: 80
    - lux: 1000.0
      brightness: 100
    # Ignore target changes smaller than this.
    hysteresis_percent: 4
    # Seconds to glide from the current to the target level.
    slew_s: 2.0
    # Below this lux the face uses the night palette.
    night_lux_threshold: 5.0
    night_hysteresis_lux: 2.0
    # Brightness cap in the hour after sunset.
    post_sunset_cap_percent: 40
    post_sunset_cap_minutes: 60
    # Use the night palette from sunset to sunrise (schedule).
    sunset_night_palette: true
    # Manual slider override lasts until the next sunrise, or forever.
    manual_override_until: sunrise
    standby_wake_percent: 100
  # URL the dawn-face kiosk opens.
  kiosk_url: http://127.0.0.1:8080/face

audio:
  backend: auto
  # Boot-time sink selection order.
  sink_priority:
  - usb
  - hifiberry
  - headphones
  - hdmi
  # Sink to always use: a PipeWire node.name, or a kind (usb, hifiberry, headphones, hdmi). null = auto.
  pinned_sink: null
  default_volume: 35
  # Highest volume any control, alarm ramp or chime may set.
  max_volume: 100
  # Hardware sink level at volume 100. Calibrate on the device so 100 sits just below audible clipping.
  output_ceiling_percent: 100
  # Duck level before pausing a lower-priority source.
  duck_percent: 20
  duck_seconds: 2.0
  volume_overlay_s: 1.5
  eq:
    enabled: true
    bass_db: 0.0
    treble_db: 0.0
    bass_hz: 120.0
    treble_hz: 6000.0
    # Most bass boost allowed. Every +6 dB needs 4x the amplifier power; keep 0 for the 3 W I2S amp.
    bass_max_db: 0.0
    # 2nd-order high-pass ahead of the tone controls, protecting a small driver (null = off).
    highpass_hz: 110.0
  mpv_binary: mpv
  mpv_extra_args: []
  # Local playlist files.
  media_dir: /var/lib/dawn/media
  # Override bundled chime directory.
  chime_dir: null
  default_chime: gentle_bell

airplay:
  enabled: true
  # Advertised name (null = general.name).
  name: null
  metadata_pipe: /tmp/shairport-sync-metadata
  # Use the shairport-sync D-Bus interface for pause/resume.
  dbus: true

bluetooth:
  enabled: true
  # Advertised name (null = general.name).
  name: null
  auto_reconnect: true
  discoverable_timeout_s: 180
  adapter: hci0

dab:
  enabled: true
  # welle-cli web interface base URL.
  welle_url: http://127.0.0.1:8000
  welle_binary: welle-cli
  # Extra welle-cli args (channel and gain are added by the service). Add -C 1 -P to collect logos for every station in the background (one more programme decoded and MP3-encoded all the time).
  welle_args:
  - -w
  - '8000'
  # systemd unit that runs welle-cli.
  service_name: dawn-dab
  # Channel to tune at boot if nothing was played before.
  default_channel: 9A
  # Channels scanned first (Australian capitals).
  scan_priority:
  - 9A
  - 9B
  - 9C
  - 8A
  - 8B
  - 8C
  - 8D
  # All Band III channels considered by a scan.
  scan_channels:
  - 5A
  - 5B
  - 5C
  - 5D
  - 6A
  - 6B
  - 6C
  - 6D
  - 7A
  - 7B
  - 7C
  - 7D
  - 8A
  - 8B
  - 8C
  - 8D
  - 9A
  - 9B
  - 9C
  - 9D
  - 10A
  - 10B
  - 10C
  - 10D
  - 11A
  - 11B
  - 11C
  - 11D
  - 12A
  - 12B
  - 12C
  - 12D
  - 13A
  - 13B
  - 13C
  - 13D
  - 13E
  - 13F
  # Seconds to wait for sync on each channel.
  scan_dwell_s: 6.0
  # Seconds to keep waiting on a channel that shows a DAB signal but has not decoded yet (weak ensembles can take 20 s or more to lock).
  scan_signal_wait_s: 40.0
  # Seconds to wait for sync after tuning to a station on another ensemble (a weak ensemble can take 30 s to lock).
  sync_timeout_s: 45.0
  # No audio flowing for this long = failure.
  audio_timeout_s: 15.0
  # Fixed tuner gain in dB, rounded to the nearest R820T/R828D step (null or negative = AGC).
  gain: null
  # How often /mux.json is read for DLS/MOT.
  poll_interval_s: 1.0

alarm_defaults:
  volume: 70
  ramp_seconds: 60
  ramp_start_percent: 10
  snooze_minutes: 9
  # Switch to the chime after this long without audio.
  fallback_after_s: 15
  # Switch from the chime to the backup tone (a beep played without mpv, plus the face and an optional GPIO buzzer) after this long without audio.
  buzzer_after_s: 8
  # Get each alarm's sound ready this many minutes ahead: the players are started, the DAB radio is tuned and in sync, and scans wait until it has rung (0 = off).
  prepare_minutes: 5
  max_ring_minutes: 30
  # Fire late if within this window after boot.
  missed_grace_minutes: 10
  light_wake_minutes: 10
  chime: gentle_bell
  buzzer:
    # BCM pin of an optional active piezo buzzer (e.g. 26 = header pin 37, its − to pin 39 GND); null = none fitted. It only sounds with the backup tone.
    gpio_pin: null
    # False for buzzer modules that sound when the pin is pulled low.
    gpio_active_high: true

timers:
  sleep_choices_min:
  - 15
  - 30
  - 45
  - 60
  - 90
  sleep_fade_s: 30
  nap_choices_min:
  - 20
  - 30
  - 45
  - 60
  nap_default_min: 20
  nap_volume: 60
  nap_chime: rising_synth

time_sources:
  chrony_poll_s: 30
  chronyc_binary: chronyc
  # Source considered stale after this long without samples.
  stale_after_s: 600
  gps:
    enabled: true
    source: auto
    gpsd_host: 127.0.0.1
    gpsd_port: 2947
    serial_device: /dev/ttyACM0
    serial_baud: 9600

weather:
  enabled: true
  provider: open-meteo
  base_url: https://api.open-meteo.com/v1/forecast
  interval_minutes: 15
  stale_after_hours: 2.0
  units: celsius

network:
  hotspot:
    enabled: true
    # Hotspot SSID (null = <name>-<serial4>).
    ssid: null
    password: dawnsetup
    # Seconds without a network before the hotspot starts.
    wait_for_network_s: 45
    interface: wlan0
  online_check_host: 1.1.1.1
  online_check_interval_s: 30

web:
  host: 0.0.0.0
  port: 8080
  # Built web assets (null = bundled web/dist).
  static_dir: null
  cors_origins:
  - '*'
  auth:
    # Optional PIN for the control UI (null = open on the LAN).
    pin: null
    session_hours: 720

system:
  heartbeat_interval_s: 5
  # Send systemd watchdog keepalives.
  watchdog: true
  cpu_temp_path: /sys/class/thermal/thermal_zone0/temp
  # Reads under-voltage / throttling flags on a Pi.
  vcgencmd_binary: vcgencmd
  # Git checkout used by the software updater.
  update_repo_dir: /opt/dawn
  update_branch: main
  sudo_binary: sudo
  allow_shutdown: true
  log_tail_lines: 200

diagnostics:
  # Days of signal and timing history kept for the Diagnostics graphs (one row a minute).
  history_days: 7
  # How often the checks behind the Diagnostics page run in the background.
  check_interval_s: 60
  # Status file written by dawn-timed (DAB time to chrony).
  timed_status_file: /run/dawn-timed/status.json

sim:
  # Sim hub base URL (used when DAWN_SIM=1).
  hub_url: http://127.0.0.1:8099
