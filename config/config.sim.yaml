# Configuration used by `make sim` (DAWN_SIM=1). Hardware backends are swapped
# for simulators that talk to the sim hub on http://127.0.0.1:8099.
version: 1
general:
  name: Dawn (sim)
  timezone: Australia/Sydney
  log_level: INFO
  data_dir: ./var/dawn
  runtime_dir: ./var/run
location:
  latitude: -33.8688
  longitude: 151.2093
  city_label: Sydney
inputs:
  pin_factory: mock
display:
  panel: hdmi
  backlight:
    driver: sim
  lux_sensor:
    driver: sim
audio:
  backend: sim
  media_dir: ./var/dawn/media
dab:
  welle_url: http://127.0.0.1:8000
  scan_dwell_s: 2.5
  sync_timeout_s: 5
  # a short list keeps the simulated scan quick
  scan_channels: [9A, 9B, 9C, 8A, 8B, 8C, 8D, 10A, 10B]
time_sources:
  gps:
    source: sim
web:
  port: 8080
system:
  watchdog: false
  update_repo_dir: .
sim:
  hub_url: http://127.0.0.1:8099
