version: 1
general:
  name: Dawn (sim)
  timezone: Australia/Sydney
  hostname: dawn
  log_level: INFO
  data_dir: ./var/dawn
  runtime_dir: ./var/run
location:
  latitude: -33.8688
  longitude: 151.2093
  elevation_m: 0.0
  prefer_gps: true
  city_label: Sydney
holidays:
  region: NSW
  scope: statewide
  extra_dates: []
  exclude_names: []
inputs:
  pin_factory: mock
  encoder:
    enabled: true
    clk_pin: 17
    dt_pin: 27
    sw_pin: 22
    volume_step: 2
    long_press_s: 1.0
    invert: false
    bounce_time_s: 0.005
  big_button:
    enabled: true
    pin: 23
    long_press_s: 3.0
    bounce_time_s: 0.02
  standby_wake_s: 20
  touch_menu_timeout_s: 15
display:
  panel: hdmi
  width: 800
  height: 480
  rotation: 0
  layout: rect
  theme: dark
  low_cpu: auto
  show_seconds: false
  clock_24h: true
  ambient_after_s: 20
  scene: true
  sleep:
    enabled: false
    start_at_time: true
    start: '22:30'
    start_when_dark: true
    end_at_time: true
    end: 06:30
    end_before_alarm: true
    alarm_lead_minutes: 10
    end_when_bright: true
    dark_lux: 3.0
    dark_after_s: 60
    bright_lux: 30.0
    bright_after_s: 20
    jump_every_s: 120
    level_percent: 72
    backlight_percent: null
    screen_off: false
    wake_percent: 15
  burn_in:
    pixel_orbit: true
    strip_autohide_s: 120
    scene_daily: true
  backlight:
    driver: sim
    sysfs_path: null
    pwm_pin: 19
    pwm_frequency_hz: 1000
    min_percent: 1
    max_percent: 100
    invert: false
  lux_sensor:
    driver: sim
    i2c_bus: 1
    address: null
    sample_hz: 10.0
    smoothing: 0.3
  brightness:
    mode: auto
    manual_percent: 60
    curve:
    - lux: 0.0
      brightness: 1
    - lux: 3.0
      brightness: 6
    - lux: 20.0
      brightness: 20
    - lux: 100.0
      brightness: 45
    - lux: 400.0
      brightness: 80
    - lux: 1000.0
      brightness: 100
    hysteresis_percent: 4
    slew_s: 2.0
    night_lux_threshold: 5.0
    night_hysteresis_lux: 2.0
    post_sunset_cap_percent: 40
    post_sunset_cap_minutes: 60
    sunset_night_palette: true
    manual_override_until: sunrise
    standby_wake_percent: 100
  kiosk_url: http://127.0.0.1:8080/face
audio:
  backend: sim
  sink_priority:
  - usb
  - hifiberry
  - headphones
  - hdmi
  pinned_sink: null
  default_volume: 35
  max_volume: 100
  output_ceiling_percent: 100
  duck_percent: 20
  duck_seconds: 2.0
  volume_overlay_s: 1.5
  eq:
    enabled: true
    bass_db: 0.0
    treble_db: 0.0
    bass_hz: 120.0
    treble_hz: 6000.0
    bass_max_db: 0.0
    highpass_hz: 110.0
  mpv_binary: mpv
  mpv_extra_args: []
  media_dir: ./var/dawn/media
  chime_dir: null
  default_chime: gentle_bell
airplay:
  enabled: true
  name: null
  metadata_pipe: /tmp/shairport-sync-metadata
  dbus: true
bluetooth:
  enabled: true
  name: null
  auto_reconnect: true
  discoverable_timeout_s: 180
  adapter: hci0
dab:
  enabled: true
  welle_url: http://127.0.0.1:8000
  welle_binary: welle-cli
  welle_args:
  - -w
  - '8000'
  service_name: dawn-dab
  default_channel: 9A
  scan_priority:
  - 9A
  - 9B
  - 9C
  - 8A
  - 8B
  - 8C
  - 8D
  scan_channels:
  - 9A
  - 9B
  - 9C
  - 8A
  - 8B
  - 8C
  - 8D
  - 10A
  - 10B
  scan_dwell_s: 2.5
  sync_timeout_s: 5.0
  audio_timeout_s: 15.0
  gain: null
  poll_interval_s: 1.0
alarm_defaults:
  volume: 70
  ramp_seconds: 60
  ramp_start_percent: 10
  snooze_minutes: 9
  fallback_after_s: 15
  buzzer_after_s: 8
  prepare_minutes: 5
  max_ring_minutes: 30
  missed_grace_minutes: 10
  light_wake_minutes: 10
  chime: gentle_bell
  buzzer:
    gpio_pin: null
    gpio_active_high: true
timers:
  sleep_choices_min:
  - 15
  - 30
  - 45
  - 60
  - 90
  sleep_fade_s: 30
  nap_choices_min:
  - 20
  - 30
  - 45
  - 60
  nap_default_min: 20
  nap_volume: 60
  nap_chime: rising_synth
time_sources:
  chrony_poll_s: 30
  chronyc_binary: chronyc
  stale_after_s: 600
  gps:
    enabled: true
    source: sim
    gpsd_host: 127.0.0.1
    gpsd_port: 2947
    serial_device: /dev/ttyACM0
    serial_baud: 9600
weather:
  enabled: true
  provider: open-meteo
  base_url: http://127.0.0.1:8099/openmeteo
  interval_minutes: 5
  stale_after_hours: 2.0
  units: celsius
network:
  hotspot:
    enabled: true
    ssid: null
    password: dawnsetup
    wait_for_network_s: 45
    interface: wlan0
  online_check_host: 1.1.1.1
  online_check_interval_s: 30
web:
  host: 0.0.0.0
  port: 8080
  static_dir: null
  cors_origins:
  - '*'
  auth:
    pin: null
    session_hours: 720
system:
  heartbeat_interval_s: 5
  watchdog: false
  cpu_temp_path: /sys/class/thermal/thermal_zone0/temp
  vcgencmd_binary: vcgencmd
  update_repo_dir: .
  update_branch: main
  sudo_binary: sudo
  allow_shutdown: true
  log_tail_lines: 200
diagnostics:
  history_days: 7
  check_interval_s: 60
  timed_status_file: ./var/run/dawn-timed/status.json
sim:
  hub_url: http://127.0.0.1:8099
