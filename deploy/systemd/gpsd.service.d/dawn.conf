# Dawn: gpsd restarts by itself and never gives up. The stock unit has no Restart=, so a clean exit (or a crash
# systemd does not count as a failure) left it down until dawn-core's supervisor noticed it "failed"; a hung gpsd
# is restarted by the supervisor (see core/dawn_core/system/supervisor.py).
[Unit]
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSec=5
