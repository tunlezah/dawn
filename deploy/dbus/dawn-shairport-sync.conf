<!-- Dawn: shairport-sync runs as user dawn (deploy/systemd/shairport-sync.service.d/dawn.conf) so its
     PipeWire backend reaches dawn's audio session; let that user own the D-Bus name dawn-core uses
     for AirPlay pause/resume. Upstream's policy only allows root and shairport-sync. -->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
          "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="dawn">
    <allow own="org.gnome.ShairportSync"/>
  </policy>
</busconfig>
