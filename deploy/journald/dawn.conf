# Dawn (/etc/systemd/journald.conf.d/dawn.conf): keep the journal across reboots, so the night that ended in a
# reboot (a watchdog, a power cut) can still be read the next morning (`journalctl -b -1`), and keep it small for
# the SD card.
[Journal]
Storage=persistent
SystemMaxUse=64M
SystemMaxFileSize=8M
MaxRetentionSec=14day
