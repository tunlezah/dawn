// Dawn shairport-sync configuration (/etc/shairport-sync.conf)
// Built with --with-airplay-2 --with-pw --with-metadata --with-dbus-interface; nqptp provides timing.
general = {
  name = "Dawn";                 // dawn-core rewrites this from config (airplay.name / general.name)
  output_backend = "pw";         // PipeWire
  interpolation = "soxr";
  volume_range_db = 60;
  ignore_volume_control = "no";
};
sessioncontrol = {
  allow_session_interruption = "yes";
  session_timeout = 20;
};
metadata = {
  enabled = "yes";
  include_cover_art = "yes";
  cover_art_cache_directory = "";
  pipe_name = "/tmp/shairport-sync-metadata";
  pipe_timeout = 5000;
};
pw = {
  application_name = "shairport-sync";
  node_name = "shairport-sync";
};
diagnostics = {
  log_verbosity = 0;
};
