// Dawn shairport-sync configuration (/etc/shairport-sync.conf)
// Built with --with-airplay-2 --with-pipewire --with-metadata --with-dbus-interface; nqptp provides timing.
general = {
  name = "Dawn";                 // dawn-core rewrites this from config (airplay.name / general.name)
  output_backend = "pipewire";   // PipeWire (shairport-sync 4.3+ name; "pw" is rejected)
  interpolation = "soxr";
  volume_range_db = 60;
  ignore_volume_control = "no";
};
sessioncontrol = {
  allow_session_interruption = "yes";
  session_timeout = 60;          // shairport-sync rejects values below 60
};
metadata = {
  enabled = "yes";
  include_cover_art = "yes";
  pipe_name = "/tmp/shairport-sync-metadata";
  pipe_timeout = 5000;
};
pipewire = {
  application_name = "shairport-sync";
  node_name = "shairport-sync";
};
diagnostics = {
  log_verbosity = 0;
};
