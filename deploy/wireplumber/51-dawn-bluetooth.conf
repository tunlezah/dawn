# Dawn WirePlumber Bluetooth policy (/etc/wireplumber/wireplumber.conf.d/51-dawn-bluetooth.conf)
# Dawn is an A2DP *sink* (phones play to it). Enable the sink role and the usual codecs,
# keep devices auto-connecting, and prefer AAC/SBC-XQ for quality.
monitor.bluez.properties = {
  bluez5.enable-sbc-xq = true
  bluez5.enable-msbc   = false
  bluez5.enable-hw-volume = true
  bluez5.roles = [ a2dp_sink ]
  bluez5.codecs = [ sbc sbc_xq aac ldac aptx aptx_hd ]
  bluez5.hfphsp-backend = "none"
}
monitor.bluez.rules = [
  { matches = [ { device.name = "~bluez_card.*" } ]
    actions = { update-props = { bluez5.auto-connect = [ a2dp_sink ] device.profile = "a2dp-sink" } } }
  { matches = [ { node.name = "~bluez_input.*" } ]
    actions = { update-props = { node.pause-on-idle = false session.suspend-timeout-seconds = 0 } } }
]
