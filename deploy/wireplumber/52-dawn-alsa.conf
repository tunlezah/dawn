# Dawn WirePlumber ALSA policy (/etc/wireplumber/wireplumber.conf.d/52-dawn-alsa.conf)
# Keep ALSA output devices open and running when idle. The MAX98357A on the I2S amp pops every
# time the I2S clocks start or stop, which by default happens whenever a stream ends and again
# when the sink is suspended after 5 s. Keeping the sink running costs well under 0.1 W.
monitor.alsa.rules = [
  { matches = [ { node.name = "~alsa_output.*" } ]
    actions = { update-props = { session.suspend-timeout-seconds = 0 node.pause-on-idle = false } } }
]
