# Dawn tone control for a mono amplifier (Pimoroni Audio Amp SHIM, MAX98357A on I2S):
# a PipeWire filter-chain sink named "dawn_eq". `install.sh --audio hifiberry` installs this file
# as /etc/pipewire/pipewire.conf.d/dawn-eq.conf (user session of 'dawn').
#
# The SHIM drives one speaker and its left/right/mix pin setting is unconfirmed, so the mix is
# done here: (L + R) / 2 -> high-pass -> bass shelf -> treble shelf, and the result is sent to
# both I2S channels. Whichever channel the amp listens to, it gets the whole programme.
# The high-pass (2nd order, ~110 Hz) keeps the 2.5" driver and the 3 W amp out of the bass they
# cannot reproduce; dawn-core sets it from audio.eq.highpass_hz:
#   pw-cli set-param <dawn_eq node id> Props '{ params = [ "highpass:Freq" 110.0 "bass:Gain" 0.0 "treble:Gain" -2.0 ] }'
context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Dawn tone control (mono)"
      media.name       = "Dawn tone control (mono)"
      filter.graph = {
        nodes = [
          { type = builtin label = mixer        name = mix      control = { "Gain 1" = 0.5 "Gain 2" = 0.5 } }
          { type = builtin label = bq_highpass  name = highpass control = { "Freq" = 110.0  "Q" = 0.707 } }
          { type = builtin label = bq_lowshelf  name = bass     control = { "Freq" = 120.0  "Q" = 0.7 "Gain" = 0.0 } }
          { type = builtin label = bq_highshelf name = treble   control = { "Freq" = 6000.0 "Q" = 0.7 "Gain" = 0.0 } }
          { type = builtin label = copy         name = outL }
          { type = builtin label = copy         name = outR }
        ]
        links = [
          { output = "mix:Out"      input = "highpass:In" }
          { output = "highpass:Out" input = "bass:In" }
          { output = "bass:Out"     input = "treble:In" }
          { output = "treble:Out"   input = "outL:In" }
          { output = "treble:Out"   input = "outR:In" }
        ]
        inputs  = [ "mix:In 1" "mix:In 2" ]
        outputs = [ "outL:Out" "outR:Out" ]
      }
      audio.channels = 2
      audio.position = [ FL FR ]
      capture.props = {
        node.name   = "dawn_eq"
        media.class = Audio/Sink
        audio.position = [ FL FR ]
      }
      playback.props = {
        node.name = "output.dawn_eq"
        node.passive = true
        audio.position = [ FL FR ]
      }
    }
  }
]
