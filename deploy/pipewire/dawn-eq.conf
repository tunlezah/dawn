# Dawn tone control (stereo outputs): a PipeWire filter-chain sink named "dawn_eq".
# Installed to /etc/pipewire/pipewire.conf.d/dawn-eq.conf (user session of 'dawn') unless the
# install uses --audio hifiberry, which installs dawn-eq-mono.conf under the same name instead.
# Chain per channel: high-pass (2nd order) -> bass shelf -> treble shelf.
# dawn-core sets the controls at runtime with:
#   pw-cli set-param <dawn_eq node id> Props '{ params = [ "highpass:Freq" 110.0 "bass:Gain" 0.0 "treble:Gain" -2.0 ] }'
context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Dawn tone control"
      media.name       = "Dawn tone control"
      filter.graph = {
        nodes = [
          { type = builtin label = bq_highpass  name = highpass control = { "Freq" = 110.0  "Q" = 0.707 } }
          { type = builtin label = bq_lowshelf  name = bass     control = { "Freq" = 120.0  "Q" = 0.7 "Gain" = 0.0 } }
          { type = builtin label = bq_highshelf name = treble   control = { "Freq" = 6000.0 "Q" = 0.7 "Gain" = 0.0 } }
        ]
        links = [
          { output = "highpass:Out" input = "bass:In" }
          { output = "bass:Out"     input = "treble:In" }
        ]
        inputs  = [ "highpass:In" ]
        outputs = [ "treble:Out" ]
      }
      audio.channels = 2
      audio.position = [ FL FR ]
      capture.props = {
        node.name   = "dawn_eq"
        media.class = Audio/Sink
        audio.position = [ FL FR ]
      }
      playback.props = {
        node.name = "output.dawn_eq"
        node.passive = true
        audio.position = [ FL FR ]
      }
    }
  }
]
