# Dawn two-band tone control: a PipeWire filter-chain sink named "dawn_eq".
# Installed to /etc/pipewire/pipewire.conf.d/dawn-eq.conf (user session of 'dawn').
# dawn-core sets the gains at runtime with:
#   pw-cli set-param <dawn_eq node id> Props '{ params = [ "bass:Gain" 3.0 "treble:Gain" -2.0 ] }'
context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Dawn tone control"
      media.name       = "Dawn tone control"
      filter.graph = {
        nodes = [
          { type = builtin label = bq_lowshelf  name = bass   control = { "Freq" = 120.0  "Q" = 0.7 "Gain" = 0.0 } }
          { type = builtin label = bq_highshelf name = treble control = { "Freq" = 6000.0 "Q" = 0.7 "Gain" = 0.0 } }
        ]
        links = [ { output = "bass:Out" input = "treble:In" } ]
        inputs  = [ "bass:In" ]
        outputs = [ "treble:Out" ]
      }
      audio.channels = 2
      audio.position = [ FL FR ]
      capture.props = {
        node.name   = "dawn_eq"
        media.class = Audio/Sink
        audio.position = [ FL FR ]
      }
      playback.props = {
        node.name = "output.dawn_eq"
        node.passive = true
        audio.position = [ FL FR ]
      }
    }
  }
]
