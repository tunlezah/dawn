# Dawn chrony configuration (/etc/chrony/chrony.conf)
#
# Reference clocks, in order of preference:
#   SHM 0  gpsd (u-blox 7 USB, NMEA only, no PPS): preferred and trusted,
#          typical offset after the fixed 'delay' is a few tens of ms
#   SHM 2  dawn-timed: DAB+ ensemble time (FIG 0/10) from welle-cli
#   NTP    au.pool.ntp.org when the network is up
#
# Alarms are evaluated by dawn-core against the system clock only; chrony keeps
# that clock right, stepping it (makestep) on the first 3 updates if off > 1 s.

refclock SHM 0 refid GPS prefer trust offset 0.0 delay 0.2 poll 4 filter 3
refclock SHM 2:perm=0666 refid DAB delay 1.0 poll 4 filter 3
pool au.pool.ntp.org iburst maxsources 4

# Step the clock if the offset is larger than 1 s during the first 3 updates
makestep 1 3

# Keep the RTC (if any) in sync and record the drift
rtcsync
driftfile /var/lib/chrony/chrony.drift
logdir /var/log/chrony
log tracking measurements statistics

# Allow dawn-core (local) to query status with chronyc
cmdallow 127.0.0.1
bindcmdaddress 127.0.0.1

# Don't serve time to the LAN
port 0

# Be tolerant of a bad RTC on boot (Pis have none)
maxupdateskew 100.0
leapsectz right/UTC
