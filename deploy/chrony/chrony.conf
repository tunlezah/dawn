# Dawn chrony configuration (/etc/chrony/chrony.conf)
#
# Time sources, best first. Alarms need the clock right to the second and better,
# so the most accurate source that is working steers it:
#   NTP    au.pool.ntp.org: primary ('prefer') whenever the network is up. A few
#          ms from true time over home broadband.
#   SHM 0  gpsd (u-blox 7 USB, NMEA only, no PPS): fallback when NTP is gone.
#          NMEA sentences arrive tens of ms after the second they describe, so
#          'offset' adds that back (measured against NTP: GPS read 69-73 ms late
#          on the u-blox 7; Diagnostics -> Time shows the figure to use if the
#          receiver changes). Accurate to a few ms once calibrated.
#   SHM 2  dawn-timed: DAB+ ensemble time (FIG 0/10) from welle-cli. Last resort:
#          broadcasters' clocks are often seconds out, hence the large 'delay'.
#
# With 'prefer' on the pool, chrony steers from NTP only while one of its
# servers is selectable; once they stop answering (stale or unreachable) it
# falls back to GPS, and to DAB only if GPS has no fix. No source is 'trust':
# that would let a mis-calibrated GPS outvote four agreeing NTP servers.
# maxpoll 7 (128 s) keeps NTP tight and notices a dead network within minutes.

pool au.pool.ntp.org iburst maxsources 4 maxpoll 7 prefer
refclock SHM 0 refid GPS offset 0.070 delay 0.2 poll 4 filter 3
refclock SHM 2:perm=0666 refid DAB delay 1.0 poll 4 filter 3

# Step the clock if the offset is larger than 1 s during the first 3 updates
makestep 1 3

# Keep the RTC (if any) in sync and record the drift
rtcsync
driftfile /var/lib/chrony/chrony.drift
logdir /var/log/chrony
log tracking measurements statistics

# Allow dawn-core (local) to query status with chronyc
cmdallow 127.0.0.1
bindcmdaddress 127.0.0.1

# Don't serve time to the LAN
port 0

# Be tolerant of a bad RTC on boot (Pis have none)
maxupdateskew 100.0
leapsectz right/UTC
