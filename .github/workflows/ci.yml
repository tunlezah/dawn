name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/version.py check
      - name: PRs raise the version (scripts/version.py bump X.Y.Z, plus a CHANGELOG section)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --quiet --depth 1 origin "${{ github.base_ref }}"
          python3 scripts/version.py check --newer-than FETCH_HEAD

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ./core[dev] -e ./dawn-timed[dev] -e ./sim
      - run: ruff check core/dawn_core dawn-timed/dawn_timed sim/dawn_sim
      - run: cd core && pytest -q
      - run: cd dawn-timed && pytest -q
      - run: python scripts/gen_example_config.py && git diff --exit-code config/config.example.yaml

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci && npm run typecheck && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  e2e:
    runs-on: ubuntu-latest
    needs: [web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install -e ./core -e ./dawn-timed -e ./sim
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - run: cd web && npm ci && npx playwright install --with-deps chromium
      - run: |
          mkdir -p var
          DAWN_SIM=1 DAWN_CONFIG=$PWD/config/config.sim.yaml DAWN_DATA_DIR=$PWD/var/dawn python -m dawn_sim --no-keyboard > var/sim.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8080/api/health && break; sleep 1; done
          curl -s -X POST localhost:8080/api/dab/scan; sleep 45
      - run: cd web && npx playwright test
      - if: failure()
        run: tail -100 var/sim.log
